services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - my-service-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-my-service-db}
      POSTGRES_USER: ${DB_USER:-my_service}
      # DB_PASSWORD must be set in .env — no default to avoid silent misconfiguration.
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_HOST:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-my_service} -d ${DB_NAME:-my-service-db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my-service-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly yes — persists data to disk; safe default for local dev.
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT_HOST:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - my-service-network
    restart: unless-stopped

networks:
  my-service-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
